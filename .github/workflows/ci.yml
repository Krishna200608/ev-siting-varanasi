name: Continuous Integration & Dashboard Deployment Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  full-pipeline-tests:
    name: Full Pipeline & Algorithm Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip and install all project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/requirements.txt
          pip install pytest

      - name: Execute Full Test Suite
        run: |
          pytest tests/ -v

  dashboard-only-smoke:
    name: Dashboard Isolated Lightweight Smoke Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install ONLY Dashboard Lightweight Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt
          pip install pytest

      - name: Execute Dashboard Isolated Tests & Page Smoke Tests
        run: |
          pytest tests/test_dashboard.py tests/test_dashboard_smoke.py -v
